<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>의약품 정보 검색 — 프로토타입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .tab-active { border-bottom: 2px solid #2563eb; color:#2563eb; font-weight:700; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; font-size:12px; margin-right:6px; }
    .muted { color:#64748b; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
<main class="max-w-4xl mx-auto">
  <div class="bg-white rounded-2xl shadow-xl ring-1 ring-black/5 p-6 md:p-8">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500">●</div>
        <h1 class="text-xl md:text-2xl font-bold">의약품 정보 검색 — 프로토타입</h1>
      </div>
      <div class="text-sm"><a href="./index.html" class="text-slate-500 hover:text-slate-700">← 연구 안내</a></div>
    </div>

    <!-- 탭 -->
    <div class="mt-6 border-b border-slate-200">
      <nav class="flex gap-6 text-slate-600">
        <button id="tab-name" class="py-3 tab-active">이름 검색</button>
        <button id="tab-shape" class="py-3">모양 검색</button>
      </nav>
    </div>

    <!-- 이름 검색 -->
    <section id="panel-name" class="mt-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">의약품 이름</label>
      <div class="flex gap-2">
        <input id="qName" type="search" placeholder="예: 타이레놀, 게보린"
               class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="btnClearName" class="px-3 rounded-xl border border-slate-300">×</button>
        <button id="btnSearchName" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700">검색</button>
      </div>
    </section>

    <!-- 모양 검색 -->
    <section id="panel-shape" class="mt-6 hidden">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">모양(정규화)</label>
          <select id="qShape" class="w-full rounded-xl border border-slate-300 px-3 py-3"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">색상</label>
          <select id="qColor" class="w-full rounded-xl border border-slate-300 px-3 py-3"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">각인(앞/뒤/식별코드)</label>
          <input id="qImprint" type="text" placeholder="예: P180, 500"
                 class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <div class="mt-3">
        <button id="btnSearchShape" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700">검색</button>
        <button id="btnResetShape" class="ml-2 px-5 py-3 rounded-xl border border-slate-300">초기화</button>
      </div>
    </section>

    <!-- 안내/카운트 -->
    <div id="helpBox" class="mt-6">
      <div class="rounded-xl border border-slate-200 p-5 text-center text-slate-500">이름 또는 모양으로 의약품을 검색해 보세요.</div>
    </div>
    <div id="countBox" class="mt-4 hidden text-sm text-slate-500"></div>

    <!-- 결과 -->
    <section id="resultList" class="mt-4 grid gap-3"></section>
    <div class="mt-4 text-center">
      <button id="btnMore" class="hidden px-5 py-3 rounded-xl border border-slate-300 bg-white">더보기</button>
    </div>

    <!-- 로딩/폴백 -->
    <div id="loaderMsg" class="mt-6 text-sm text-slate-500">CSV 불러오는 중…</div>
    <div id="fallback" class="mt-3 hidden">
      <p class="text-red-600 text-sm mb-2">자동 로딩 실패 — CSV 파일을 직접 선택해 주세요.</p>
      <input id="fileInput" type="file" accept=".csv" />
    </div>

    <!-- 링크 -->
    <div class="mt-6 text-sm flex gap-4">
      <a href="./drugs.csv" target="_blank" class="text-blue-700 hover:underline">현재 CSV 보기</a>
      <a href="./drug_normalizer_extended.html" target="_blank" class="text-slate-500 hover:underline">CSV 정규화 도구 열기</a>
    </div>
  </div>
</main>

<script>
/* ========= 별칭/정제 유틸 ========= */
const FIELD_ALIASES = {
  NAME:   ['DRUG_NAME','ITEM_NAME','제품명','drug_name','item_name','item','name','제품'],
  COMPANY:['COMPANY','MANUFACTURER','ENTP_NAME','업체명','제조사','판매사','회사','company','maker'],
  CLASS:  ['CLASS_NAME','CLASS_NO_NAME','약효분류','효능군','분류','class'],
  SHAPE:  ['DRUG_SHAPE','모양','shape','제형'],
  COLOR:  ['COLOR_CLASS1','색상','color','색','color1'],
  IMPRINT_FRONT: ['PRINT_FRONT','앞면표기','앞표기','front_mark','line_front','front'],
  IMPRINT_BACK:  ['PRINT_BACK','뒷면표기','뒤표기','back_mark','line_back','back'],
  MARK_CODE:     ['MARK_CODE','식별코드','각인코드','imprint','imprint_code','identify_code'],
  IMAGE:  ['IMAGE_URL','이미지','이미지URL','IMG_URL','ITEM_IMAGE','ITEM_IMAGE01','IMAGE','IMG'],

  ETC_OTC:['ETC_OTC_NAME','전문/일반','구분(전문/일반)','OTC_ETC','OTC','ETC','전문일반','구분'],
  FORM:   ['FORM_CODE','FORM','FORM_NAME','제형코드','제형'],
  CHART:  ['CHART','성상','외형설명','제형설명','appearance','APPEARANCE','CHARACTER'],

  EE:     ['EE_DOC','효능','효능효과','효능/효과','INDICATION','EFFECT','EE_DOC_DATA'],
  UD:     ['UD_DOC','용법','용법용량','용법/용량','DIRECTIONS','DOSAGE','HOW_TO_USE','UD_DOC_DATA'],
  NB:     ['NB_DOC','주의','주의사항','경고','경고/주의','사용상주의사항','WARNING','PRECAUTIONS','CAUTION','ADVERSE','NB_DOC_DATA'],
  ING:    ['INGREDIENT','INGREDIENTS','INGR_NAME','MATERIAL_NAME','주성분','성분','원료성분','성분명','제성분']
};

const SHAPE_CANON = [
  '원형','타원형','장방형','사각형(정/직사각)','삼각형','오각형','육각형','팔각형','마름모형','반원형','기타'
];

function resolveField(aliasList, headers){
  const H = headers.map(h => String(h ?? '').trim());
  for (const cand of aliasList){
    const i = H.findIndex(h => h.toLowerCase() === String(cand).toLowerCase());
    if (i >= 0) return H[i];
  }
  for (const cand of aliasList){
    const i = H.findIndex(h => h.toLowerCase().includes(String(cand).toLowerCase()));
    if (i >= 0) return H[i];
  }
  return null;
}
function sanitizeText(v){
  if (v == null) return '';
  return String(v).replace(/^\uFEFF/,'').replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim();
}
const uniq = arr => [...new Set(arr)];
const $ = sel => document.querySelector(sel);

/* 모양 정규화(원문→정규 카테고리) */
function normalizeShape(raw){
  const s = sanitizeText(raw).toLowerCase();
  if (!s) return '';
  if (/(원형|정원|둥근|circle|round)/.test(s)) return '원형';
  if (/(장방|oblong|capsule|경질캡슐|연질캡슐)/.test(s)) return '장방형';
  if (/(타원|oval|ellip)/.test(s)) return '타원형';
  if (/(사각|정방|네모|직사각|square|rect)/.test(s)) return '사각형(정/직사각)';
  if (/(삼각|triangle)/.test(s)) return '삼각형';
  if (/(오각|pent)/.test(s)) return '오각형';
  if (/(육각|hex)/.test(s)) return '육각형';
  if (/(팔각|oct)/.test(s)) return '팔각형';
  if (/(마름모|rhomb)/.test(s)) return '마름모형';
  if (/(반원|semi)/.test(s)) return '반원형';
  return '기타';
}

/* 이미지 URL 정리 + 프록시(식약처/외부 핫링크 차단 대비) */
function cleanImageUrl(u) {
  if (!u) return '';
  return String(u).replace(/^"+|"+$/g, '').replace(/[\s\r\n\t]+/g, '').trim();
}
function proxyUrl(u) {
  // images.weserv.nl 은 프로토콜 제거한 호스트+경로를 인코딩해 전달
  const hostless = u.replace(/^https?:\/\//,'');
  return `https://images.weserv.nl/?url=${encodeURIComponent(hostless)}&w=160&h=160&fit=contain&il`;
}
function placeholderFor(name) {
  const label = encodeURIComponent((name||'NO IMG').slice(0,10));
  return `https://placehold.co/128x128/png?text=${label}`;
}
</script>

<script>
/* ========= 상태 ========= */
let HEADERS = [], ALL = [], VIEW = [], shown = 0;
const STEP = 20;
const resultList = $('#resultList'), loaderMsg = $('#loaderMsg'), fallback = $('#fallback'), helpBox = $('#helpBox'), countBox = $('#countBox'), btnMore = $('#btnMore');

/* ========= 탭 ========= */
$('#tab-name').addEventListener('click', () => switchTab('name'));
$('#tab-shape').addEventListener('click', () => switchTab('shape'));
function switchTab(which){
  $('#tab-name').classList.toggle('tab-active', which==='name');
  $('#tab-shape').classList.toggle('tab-active', which==='shape');
  $('#panel-name').classList.toggle('hidden', which!=='name');
  $('#panel-shape').classList.toggle('hidden', which!=='shape');
  resetView();
}
function resetView(){ resultList.innerHTML=''; helpBox.classList.remove('hidden'); countBox.classList.add('hidden'); shown=0; }

/* ========= 이름 검색 ========= */
$('#btnSearchName').addEventListener('click', () => {
  const q = sanitizeText(($('#qName').value || '')).toLowerCase();
  if (!q) { showMessage('검색어를 입력하세요.'); return; }
  const nameKey = resolveField(FIELD_ALIASES.NAME, HEADERS);
  const compKey = resolveField(FIELD_ALIASES.COMPANY, HEADERS);
  const clsKey  = resolveField(FIELD_ALIASES.CLASS, HEADERS);
  const keys = [nameKey, compKey, clsKey].filter(Boolean);
  VIEW = keys.length
    ? ALL.filter(row => keys.some(k => String(row[k]||'').toLowerCase().includes(q)))
    : [];
  if (VIEW.length === 0) {
    VIEW = ALL.filter(row => Object.values(row).some(v => String(v||'').toLowerCase().includes(q)));
  }
  renderNewResult(q);
});
$('#qName').addEventListener('keydown', e => { if (e.key==='Enter') $('#btnSearchName').click(); if (e.key==='Escape'){ $('#qName').value=''; resetView(); }});
$('#btnClearName').addEventListener('click', ()=>{ $('#qName').value=''; resetView(); });

/* ========= 모양 검색 ========= */
$('#btnSearchShape').addEventListener('click', () => {
  const shapeKey = resolveField(FIELD_ALIASES.SHAPE, HEADERS);
  const colorKey = resolveField(FIELD_ALIASES.COLOR, HEADERS);
  const fKey = resolveField(FIELD_ALIASES.IMPRINT_FRONT, HEADERS);
  const bKey = resolveField(FIELD_ALIASES.IMPRINT_BACK, HEADERS);
  const mKey = resolveField(FIELD_ALIASES.MARK_CODE, HEADERS);

  const wantedShape = $('#qShape').value;   // 정규화 카테고리
  const color = $('#qColor').value;
  const imp   = sanitizeText($('#qImprint').value).toLowerCase();

  VIEW = ALL.filter(r => {
    const recShapeCanon = normalizeShape(shapeKey ? r[shapeKey] : '');
    const okShape = !wantedShape || recShapeCanon === wantedShape;
    const okColor = !color || (colorKey && r[colorKey] === color);
    const impList = [fKey, bKey, mKey].filter(Boolean).map(k => String(r[k]||'').toLowerCase());
    const okImp   = !imp || impList.some(v => v.includes(imp));
    return okShape && okColor && okImp;
  });
  renderNewResult(imp || wantedShape || color);
});
$('#btnResetShape').addEventListener('click', () => { $('#qShape').value=''; $('#qColor').value=''; $('#qImprint').value=''; resetView(); });

/* ========= 렌더 ========= */
function renderNewResult(queryLabel){
  helpBox.classList.add('hidden'); resultList.innerHTML=''; shown=0; updateCount(queryLabel); appendMore();
}
function updateCount(q){
  const n = VIEW.length;
  countBox.textContent = `검색 결과 ${n.toLocaleString()}건` + (q ? ` (쿼리: ${q})` : '');
  countBox.classList.remove('hidden');
}
btnMore.addEventListener('click', appendMore);

function appendMore(){
  const chunk = VIEW.slice(shown, shown + STEP);
  chunk.forEach(renderCard); shown += chunk.length;
  btnMore.classList.toggle('hidden', shown >= VIEW.length);
  if (VIEW.length === 0) resultList.innerHTML = `<div class="rounded-xl border border-slate-200 p-5 text-center text-slate-500">검색 결과가 없습니다.</div>`;
}

function shortText(s, n=500){ const t=String(s||'').trim(); return t.length>n ? (t.slice(0,n)+' …') : t; }

function renderCard(row){
  const nameKey = resolveField(FIELD_ALIASES.NAME, HEADERS);
  const compKey = resolveField(FIELD_ALIASES.COMPANY, HEADERS);
  const clsKey  = resolveField(FIELD_ALIASES.CLASS, HEADERS);
  const shapeKey= resolveField(FIELD_ALIASES.SHAPE, HEADERS);
  const colorKey= resolveField(FIELD_ALIASES.COLOR, HEADERS);
  const fKey    = resolveField(FIELD_ALIASES.IMPRINT_FRONT, HEADERS);
  const bKey    = resolveField(FIELD_ALIASES.IMPRINT_BACK, HEADERS);
  const mKey    = resolveField(FIELD_ALIASES.MARK_CODE, HEADERS);
  const imgKey  = resolveField(FIELD_ALIASES.IMAGE, HEADERS);

  const etcKey  = resolveField(FIELD_ALIASES.ETC_OTC, HEADERS);
  const formKey = resolveField(FIELD_ALIASES.FORM, HEADERS);
  const chartKey= resolveField(FIELD_ALIASES.CHART, HEADERS);
  const eeKey   = resolveField(FIELD_ALIASES.EE, HEADERS);
  const udKey   = resolveField(FIELD_ALIASES.UD, HEADERS);
  const nbKey   = resolveField(FIELD_ALIASES.NB, HEADERS);
  const ingKey  = resolveField(FIELD_ALIASES.ING, HEADERS);

  const name = row[nameKey] || '(제품명 없음)';
  const classNm = row[clsKey] || '';
  const etc = row[etcKey] || '';
  const form = row[formKey] || '';
  const shape = normalizeShape(row[shapeKey] || '');
  const color = row[colorKey] || '';
  const imprint = [row[fKey], row[bKey], row[mKey]].filter(Boolean).join(' / ');

  const ee = row[eeKey], ud = row[udKey], nb = row[nbKey], ing = row[ingKey], chart = row[chartKey];

  const rawUrl = cleanImageUrl(row[imgKey]);
  const proxied = rawUrl ? proxyUrl(rawUrl) : '';
  const fallbackImg = placeholderFor(name);

  const div = document.createElement('div');
  div.className = "bg-white rounded-xl border border-slate-200 p-4 md:p-5";
  div.innerHTML = `
    <div class="flex gap-4">
      <div class="w-20 h-20 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden shrink-0">
        <img src="${proxied || fallbackImg}" alt="" class="w-full h-full object-contain"
             referrerpolicy="no-referrer" loading="lazy" decoding="async"
             onerror="this.onerror=null;this.src='${fallbackImg}'">
      </div>
      <div class="flex-1">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-lg font-semibold">${escapeHtml(name)}</h3>
          ${classNm ? `<span class="pill">${escapeHtml(classNm)}</span>` : ''} ${etc ? `<span class="pill">${escapeHtml(etc)}</span>` : ''}
        </div>
        <div class="mt-1 text-sm muted">
          ${escapeHtml(row[compKey]||'')}${(form||shape||color)?' · ':''}${escapeHtml(form||shape)}${form&&shape?'/':''}${escapeHtml(color)}
        </div>
        ${imprint ? `<div class="mt-1 text-sm muted">각인: ${escapeHtml(imprint)}</div>` : ''}

        ${ing ? block('주성분', shortText(ing, 250)) : ''}
        ${chart ? block('성상/특징', shortText(chart, 250)) : ''}

        ${(ee||ud||nb) ? `
          <details class="mt-3">
            <summary class="cursor-pointer text-blue-700 hover:underline text-sm">자세히 보기 (효능·효과 / 용법·용량 / 주의사항)</summary>
            <div class="mt-2 grid gap-3 text-sm">
              ${ee ? block('효능·효과', shortText(ee, 1200)) : ''}
              ${ud ? block('용법·용량', shortText(ud, 1200)) : ''}
              ${nb ? block('사용상 주의사항', shortText(nb, 1200)) : ''}
            </div>
          </details>` : ''}
        ${rawUrl ? `<div class="mt-2 text-xs"><a class="text-slate-500 hover:underline" href="${escapeAttr(rawUrl)}" target="_blank" rel="noopener">이미지 원본 열기</a></div>` : ''}
      </div>
    </div>
  `;
  resultList.appendChild(div);
}

function block(label, text){
  return `<div><div class="font-medium text-slate-700 mb-1">${escapeHtml(label)}</div><div class="text-slate-700 whitespace-pre-wrap">${escapeHtml(text)}</div></div>`;
}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function escapeAttr(s){ return String(s ?? '').replace(/"/g,'&quot;'); }

/* ========= CSV 로딩 ========= */
const params = new URLSearchParams(location.search);
const csvPath = params.get('file') || './drugs.csv';

function loadCSVFromText(text){
  Papa.parse(text, {
    header: true, skipEmptyLines: true,
    complete: (res) => {
      const fields = res.meta?.fields?.length ? res.meta.fields : Object.keys(res.data[0]||{});
      HEADERS = fields.map(sanitizeText);
      ALL = (res.data || []).map(row => { const o={}; for (const h of HEADERS) o[h] = sanitizeText(row[h]); return o; });
      loaderMsg.classList.add('hidden');

      // 모양/색상 옵션 채우기 (모양은 "정규화 카테고리" 고정 옵션)
      const shapeKey = resolveField(FIELD_ALIASES.SHAPE, HEADERS);
      const observedCanonShapes = shapeKey ? uniq(ALL.map(r => normalizeShape(r[shapeKey])).filter(Boolean)) : [];
      const shapeOptions = SHAPE_CANON; // 고정 리스트
      fillSelect('#qShape', shapeOptions);

      const colorKey = resolveField(FIELD_ALIASES.COLOR, HEADERS);
      fillSelect('#qColor', colorKey ? uniq(ALL.map(r=>r[colorKey]).filter(Boolean)).sort() : []);
    }
  });
}
function fillSelect(sel, items){
  const el = $(sel);
  el.innerHTML = `<option value="">전체</option>` + items.map(v=>`<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');
}

function tryFetch(){
  fetch(csvPath, { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('CSV 로드 실패'); return r.text(); })
    .then(loadCSVFromText)
    .catch(()=>{ loaderMsg.textContent = '자동 로딩 실패: CSV 경로를 확인하거나 파일을 업로드하세요.'; fallback.classList.remove('hidden'); });
}
$('#fileInput').addEventListener('change', e => {
  const f = e.target.files?.[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = ev => loadCSVFromText(ev.target.result);
  fr.readAsText(f, 'utf-8');
});

tryFetch();
</script>
</body>
</html>
