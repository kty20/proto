<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>의약품 정보 검색 — 프로토타입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .tab-active { border-bottom: 2px solid #2563eb; color:#2563eb; font-weight:700; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; font-size:12px; margin-right:6px; }
    .muted { color:#64748b; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <main class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl ring-1 ring-black/5 p-6 md:p-8">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500">●</div>
          <h1 class="text-xl md:text-2xl font-bold">의약품 정보 검색 — 프로토타입</h1>
        </div>
        <div class="text-sm"><a href="./index.html" class="text-slate-500 hover:text-slate-700">← 연구 안내</a></div>
      </div>

      <div class="mt-6 border-b border-slate-200">
        <nav class="flex gap-6 text-slate-600">
          <button id="tab-name" class="py-3 tab-active">이름 검색</button>
          <button id="tab-shape" class="py-3">모양 검색</button>
        </nav>
      </div>

      <section id="panel-name" class="mt-6">
        <label class="block text-sm font-medium text-slate-700 mb-2">의약품 이름</label>
        <div class="flex gap-2">
          <input id="qName" type="search" placeholder="예: 타이레놀, 게보린"
                 class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button id="btnSearchName" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700">검색</button>
        </div>
      </section>

      <section id="panel-shape" class="mt-6 hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">모양</label>
            <select id="qShape" class="w-full rounded-xl border border-slate-300 px-3 py-3"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">색상</label>
            <select id="qColor" class="w-full rounded-xl border border-slate-300 px-3 py-3"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">각인(앞/뒤)</label>
            <input id="qImprint" type="text" placeholder="예: P180, 500"
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div class="mt-3">
          <button id="btnSearchShape" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700">검색</button>
          <button id="btnResetShape" class="ml-2 px-5 py-3 rounded-xl border border-slate-300">초기화</button>
        </div>
      </section>

      <div id="helpBox" class="mt-6">
        <div class="rounded-xl border border-slate-200 p-5 text-center text-slate-500">이름 또는 모양으로 의약품을 검색해 보세요.</div>
      </div>
      <div id="countBox" class="mt-4 hidden text-sm text-slate-500"></div>

      <section id="resultList" class="mt-4 grid gap-3"></section>
      <div class="mt-4 text-center"><button id="btnMore" class="hidden px-5 py-3 rounded-xl border border-slate-300 bg-white">더보기</button></div>

      <div id="loaderMsg" class="mt-6 text-sm text-slate-500">CSV 불러오는 중…</div>
      <div id="fallback" class="mt-3 hidden">
        <p class="text-red-600 text-sm mb-2">자동 로딩 실패 — CSV 파일을 직접 선택해 주세요.</p>
        <input id="fileInput" type="file" accept=".csv" />
      </div>

      <div class="mt-6 text-sm flex gap-4">
        <a href="./drugs.csv" target="_blank" class="text-blue-700 hover:underline">현재 CSV 보기</a>
        <a href="./drug_normalizer_extended.html" target="_blank" class="text-slate-500 hover:underline">CSV 정규화 도구 열기</a>
      </div>
    </div>
  </main>

  <script>
    // ───── 표준 헤더 & 별칭 ─────────────────────────────────────
    const STANDARD = {
      ITEM_SEQ:     ['ITEM_SEQ','품목코드','품목기준코드','item_seq','itemcode','ITEM_CODE'],
      DRUG_NAME:    ['DRUG_NAME','ITEM_NAME','제품명','drug_name','item_name','name','제품'],
      COMPANY:      ['COMPANY','ENTP_NAME','업체명','제조사','판매사','company','maker'],
      CLASS_NAME:   ['CLASS_NAME','CLASS_NO_NM','CLASS_NO_NAME','약효분류','효능군','class'],
      ETC_OTC_NAME: ['ETC_OTC_NAME','전문/일반','OTC_ETC','etc_otc_name','구분(전문/일반)','구분'],
      FORM_CODE:    ['FORM_CODE','FORM_CODE_NAME','FORM_NAME','제형','dosage_form','form'],
      DRUG_SHAPE:   ['DRUG_SHAPE','모양','shape','제형/모양'],
      COLOR_CLASS1: ['COLOR_CLASS1','색상','color','색상1','COLOR1'],
      PRINT_FRONT:  ['PRINT_FRONT','앞면표기','앞표기','front_mark','각인(앞)'],
      PRINT_BACK:   ['PRINT_BACK','뒷면표기','뒤표기','back_mark','각인(뒤)'],
      MARK_CODE:    ['MARK_CODE','식별코드','각인코드','imprint','PRINT_CODE','IDENTIFY_CODE'],
      CHART:        ['CHART','성상','제형설명','외형설명','APPEARANCE'],
      IMAGE_URL:    ['IMAGE_URL','ITEM_IMAGE','ITEM_IMAGE01','IMG_URL','이미지','이미지URL'],
      EE_DOC:       ['EE_DOC','효능효과','EE_DOC_DATA','INDICATION'],
      UD_DOC:       ['UD_DOC','용법용량','UD_DOC_DATA','DIRECTIONS','HOW_TO_USE'],
      NB_DOC:       ['NB_DOC','주의사항','경고','NB_DOC_DATA','WARNING','PRECAUTIONS']
    };

    const SHAPE_CANON = ['', '원형','타원형','장방형','사각형','정방형','삼각형','오각형','육각형','팔각형','마름모형','장축원형','캡슐','연질캡슐','경질캡슐','정제','기타'];
    const COLOR_CANON = ['', '하양','흰색','무색','투명','노랑','주황','분홍','빨강','자주','연두','초록','청록','파랑','남색','보라','갈색','검정','회색','은색','금색'];

    // ───── 상태 ───────────────────────────────────────────────
    let HEADERS = [];
    let ALL = [];
    let VIEW = [];
    let shown = 0;
    const STEP = 20;

    const $ = s => document.querySelector(s);
    const resultList = $('#resultList'), loaderMsg = $('#loaderMsg'), fallback = $('#fallback'), helpBox = $('#helpBox'), countBox = $('#countBox'), btnMore = $('#btnMore');

    // ───── 헤더 매칭 유틸 ──────────────────────────────────────
    const norm = s => String(s||'').replace(/^\uFEFF/,'').trim().toLowerCase();
    function resolveKey(aliases, headers){
      const H = headers.map(h=>norm(h));
      for (const a of aliases){ const i = H.indexOf(norm(a)); if (i>=0) return headers[i]; }
      // 부분일치 보조
      for (const a of aliases){ const i = H.findIndex(h=>h.includes(norm(a))); if (i>=0) return headers[i]; }
      return null;
    }
    function buildFieldMap(headers){
      const M = {};
      for (const [k,alts] of Object.entries(STANDARD)) M[k] = resolveKey(alts, headers);
      return M;
    }
    const get = (row, keyMap, k) => keyMap[k] ? (row[keyMap[k]] ?? '') : '';

    // ───── 탭 ─────────────────────────────────────────────────
    $('#tab-name').addEventListener('click', () => switchTab('name'));
    $('#tab-shape').addEventListener('click', () => switchTab('shape'));
    function switchTab(which){
      $('#tab-name').classList.toggle('tab-active', which==='name');
      $('#tab-shape').classList.toggle('tab-active', which==='shape');
      $('#panel-name').classList.toggle('hidden', which!=='name');
      $('#panel-shape').classList.toggle('hidden', which!=='shape');
      resultList.innerHTML=''; helpBox.classList.remove('hidden'); countBox.classList.add('hidden');
    }

    // ───── 검색 ───────────────────────────────────────────────
    let F = {}; // 필드맵
    $('#btnSearchName').addEventListener('click', () => {
      const q = ($('#qName').value||'').trim().toLowerCase();
      if(!q){ showMessage('검색어를 입력하세요.'); return; }
      const keys = ['DRUG_NAME','COMPANY','CLASS_NAME'].filter(k=>F[k]);
      VIEW = ALL.filter(r => keys.some(k => String(get(r,F,k)).toLowerCase().includes(q)));
      renderNewResult(q);
    });
    $('#qName').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnSearchName').click(); });

    $('#btnSearchShape').addEventListener('click', () => {
      const shape = $('#qShape').value, color = $('#qColor').value, imp = ($('#qImprint').value||'').trim().toLowerCase();
      VIEW = ALL.filter(r=>{
        const okShape = !shape || get(r,F,'DRUG_SHAPE')===shape;
        const okColor = !color || get(r,F,'COLOR_CLASS1')===color;
        const okImp = !imp || ['PRINT_FRONT','PRINT_BACK','MARK_CODE'].filter(k=>F[k])
                         .some(k => String(get(r,F,k)||'').toLowerCase().includes(imp));
        return okShape && okColor && okImp;
      });
      renderNewResult(imp||shape||color);
    });
    $('#btnResetShape').addEventListener('click', ()=>{
      $('#qShape').value=''; $('#qColor').value=''; $('#qImprint').value='';
      resultList.innerHTML=''; helpBox.classList.remove('hidden'); countBox.classList.add('hidden');
    });

    function renderNewResult(q){
      helpBox.classList.add('hidden'); resultList.innerHTML=''; shown=0; updateCount(q); appendMore();
    }
    function updateCount(q){
      const n = VIEW.length;
      countBox.textContent = n ? `검색 결과 ${n.toLocaleString()}건` + (q?` (쿼리: ${q})`:'') : '검색 결과가 없습니다.';
      countBox.classList.remove('hidden');
    }
    btnMore.addEventListener('click', appendMore);
    function appendMore(){
      const chunk = VIEW.slice(shown, shown+STEP); chunk.forEach(renderCard); shown+=chunk.length;
      btnMore.classList.toggle('hidden', shown>=VIEW.length);
      if(VIEW.length===0) resultList.innerHTML=`<div class="rounded-xl border border-slate-200 p-5 text-center text-slate-500">검색 결과가 없습니다.</div>`;
    }

    // ───── 이미지(프록시→원본→플레이스홀더) ───────────────────
    function cleanUrl(u){ return String(u||'').replace(/^"+|"+$/g,'').trim(); }
    function buildImageSrcs(raw){
      const u = cleanUrl(raw); if(!u) return [];
      const noProto = u.replace(/^https?:\/\//,'');
      const prox = 'https://images.weserv.nl/?url='+encodeURIComponent(noProto)+'&w=160&h=160&fit=cover&n=-1';
      return [prox,u];
    }
    function thumb(url){
      const [s1,s2]=buildImageSrcs(url); if(!s1 && !s2) return `<span class="text-slate-400 text-xs">NO IMG</span>`;
      const a1=(s1||'').replace(/"/g,'&quot;'), a2=(s2||'').replace(/"/g,'&quot;');
      return `<img src="${a1||a2}" alt="" referrerpolicy="no-referrer" loading="lazy" class="w-full h-full object-cover"
        onerror="if(this.dataset.fallback!=='1'&&'${a2}'){this.dataset.fallback='1';this.src='${a2}';this.referrerPolicy='no-referrer';}
                 else{this.onerror=null;this.src='data:image/svg+xml;utf8,${encodeURIComponent(
                   `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;160&quot; height=&quot;160&quot;>
                      <rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#f1f5f9&quot;/>
                      <text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot;
                            font-size=&quot;12&quot; fill=&quot;#94a3b8&quot;>NO IMAGE</text>
                    </svg>`
                 )}';}">`;
    }

    // ───── 카드 렌더 ─────────────────────────────────────────
    function renderCard(row){
      const etc = pill(get(row,F,'ETC_OTC_NAME'));
      const cls = pill(get(row,F,'CLASS_NAME'));
      const shape = get(row,F,'DRUG_SHAPE') ? ` · ${get(row,F,'DRUG_SHAPE')}` : '';
      const color = get(row,F,'COLOR_CLASS1') ? ` · ${get(row,F,'COLOR_CLASS1')}` : '';
      const imprint = [get(row,F,'PRINT_FRONT'),get(row,F,'PRINT_BACK')].filter(Boolean).join(' / ');
      const imgHtml = thumb(get(row,F,'IMAGE_URL'));

      const detailsHtml = `
        ${get(row,F,'CHART')   ? block('성상/특징', get(row,F,'CHART')) : ''}
        ${get(row,F,'EE_DOC')  ? block('효능·효과', get(row,F,'EE_DOC')) : ''}
        ${get(row,F,'UD_DOC')  ? block('용법·용량', get(row,F,'UD_DOC')) : ''}
        ${get(row,F,'NB_DOC')  ? block('주의사항', get(row,F,'NB_DOC')) : ''}
        ${get(row,F,'MARK_CODE') ? block('식별코드', get(row,F,'MARK_CODE')) : ''}
        ${get(row,F,'IMAGE_URL') ? `<div class="text-sm"><a href="${escapeAttr(get(row,F,'IMAGE_URL'))}" target="_blank" class="text-blue-700 hover:underline">이미지 원본 열기</a></div>` : ''}
      `;

      const div = document.createElement('div');
      div.className = "bg-white rounded-xl border border-slate-200 p-4 md:p-5";
      div.innerHTML = `
        <div class="flex gap-4">
          <div class="w-20 h-20 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden shrink-0">${imgHtml}</div>
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <h3 class="text-lg font-semibold">${escapeHtml(get(row,F,'DRUG_NAME') || '(제품명 없음)')}</h3>
              ${etc}${cls}
            </div>
            <div class="mt-1 text-sm muted">
              ${escapeHtml(get(row,F,'COMPANY')||'')}
              ${get(row,F,'ITEM_SEQ') ? ' · ' + escapeHtml(get(row,F,'ITEM_SEQ')) : ''} ${shape}${color}
            </div>
            <div class="mt-1 text-sm muted">${imprint ? '각인: ' + escapeHtml(imprint) : ''}</div>
            <details class="mt-2">
              <summary class="cursor-pointer text-blue-700 hover:underline text-sm">자세히 보기 (효능·효과 / 용법·용량 / 주의사항)</summary>
              <div class="mt-2 grid gap-2 text-sm">${detailsHtml}</div>
            </details>
          </div>
        </div>`;
      resultList.appendChild(div);
    }
    const pill = t => t ? `<span class="pill">${escapeHtml(t)}</span>` : '';
    function block(label, text){
      const s = String(text||''); const short = s.length>600 ? s.slice(0,600)+' …' : s;
      return `<div><div class="font-medium text-slate-700 mb-1">${label}</div>
              <div class="text-slate-700 whitespace-pre-wrap">${escapeHtml(short)}</div></div>`;
    }
    const escapeHtml = s => String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    const escapeAttr = s => String(s).replace(/"/g,'&quot;');

    function showMessage(msg){
      helpBox.classList.remove('hidden');
      helpBox.innerHTML = `<div class="rounded-xl border border-slate-200 p-5 text-center text-slate-500">${escapeHtml(msg)}</div>`;
    }

    // ───── CSV 로딩 ───────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const csvPath = params.get('file') || './drugs.csv';

    function loadCSVFromText(text){
      Papa.parse(text, {
        header:true, skipEmptyLines:true,
        complete:(res)=>{
          const fields = (res.meta?.fields?.length ? res.meta.fields : Object.keys(res.data[0]||[])).map(h=>h.replace(/^\uFEFF/,''));
          HEADERS = fields;
          F = buildFieldMap(fields); // ▲ 별칭 매칭
          ALL = (res.data||[]).map(row=>{
            const o={}; for(const h of fields) o[h]=row[h] ?? ''; return o;
          });

          // 모양/색상 옵션: 캐논 + 데이터
          const shapes = uniq([ ...SHAPE_CANON, ...ALL.map(r=>get(r,F,'DRUG_SHAPE')).filter(Boolean) ]);
          const colors = uniq([ ...COLOR_CANON, ...ALL.map(r=>get(r,F,'COLOR_CLASS1')).filter(Boolean) ]);
          fillSelect('#qShape', shapes); fillSelect('#qColor', colors);

          loaderMsg.classList.add('hidden');
        }
      });
    }
    function fillSelect(sel, items){
      const el = $(sel);
      el.innerHTML = items.map((v,i)=>`<option value="${escapeAttr(v)}">${escapeHtml(i===0? (v||'전체') : v)}</option>`).join('');
    }
    const uniq = arr => [...new Set(arr)];
    function tryFetch(){
      fetch(csvPath, { cache:'no-store' })
        .then(r=>{ if(!r.ok) throw new Error('CSV 로드 실패'); return r.text(); })
        .then(loadCSVFromText)
        .catch(()=>{ loaderMsg.textContent='자동 로딩 실패: 서버/파일명 확인 또는 CSV 업로드'; fallback.classList.remove('hidden'); });
    }
    $('#fileInput').addEventListener('change', e=>{
      const f=e.target.files?.[0]; if(!f) return;
      const fr=new FileReader(); fr.onload=ev=>loadCSVFromText(ev.target.result); fr.readAsText(f,'utf-8');
    });

    tryFetch();
  </script>
</body>
</html>
